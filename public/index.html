// ── Sincronización de keywords con el backend (fuente única de verdad) ────
// En cada carga de la página, el frontend le pregunta al backend cuáles son
// las keywords vigentes y AGREGA las que falten en el localStorage local,
// sin tocar ni borrar nada de lo que el usuario ya tenía configurado
// (keywords activas/inactivas, keywords agregadas manualmente con el botón
// "+ Agregar"). Esto evita que, de ahora en adelante, una keyword nueva
// agregada al backend quede invisible en el frontend por falta de
// sincronización manual del index.html — la causa raíz de la mayoría de los
// casos de "el backend encuentra la licitación pero no aparece en pantalla".
//
// Si el backend no responde (caído, sin red), esta función simplemente no
// hace nada y el agente sigue funcionando exactamente igual que antes, con
// los defaults locales — no rompe nada en caso de falla.
function normSync(s) {
  return (s || "").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/['''`´]/g, "").trim();
}
async function sincronizarKeywordsConBackend() {
  let backendConfig = null;
  try {
    const res = await fetch(`${BACKEND_URL}/mp/keywords-config`);
    if (res.ok) backendConfig = await res.json();
  } catch (e) {
    console.warn("[LEN] No se pudo sincronizar keywords con el backend, se usan los valores locales:", e.message);
  }
  if (!backendConfig) return;

  DIVISIONS.forEach(div => {
    const cfg = backendConfig[div.id];
    if (!cfg) return;

    // Keywords técnicas: se revisa contra TODOS los grupos de la división
    // (p.ej. Zona Sur tiene grupos "Vial" e "Hidráulica" por separado) para
    // no duplicar una keyword que ya vive en otro grupo.
    const yaExisten = new Set();
    div.grupos.forEach(g => {
      lsGet(g.lsKey, g.defaults).forEach(k => yaExisten.add(normSync(k)));
    });
    const nuevasKw = (cfg.keywords || []).filter(k => !yaExisten.has(normSync(k)));
    if (nuevasKw.length) {
      const g0 = div.grupos[0];
      const stored = lsGet(g0.lsKey, g0.defaults);
      const active = lsGet(g0.lsKey + "_active", g0.defaults);
      lsSet(g0.lsKey, [...stored, ...nuevasKw]);
      lsSet(g0.lsKey + "_active", [...active, ...nuevasKw]);
      console.log(`[LEN] ${div.id}: ${nuevasKw.length} keyword(s) nueva(s) sincronizada(s) desde backend →`, nuevasKw);
    }

    // Servicios
    const storedServ = lsGet(div.servicios.lsKey, div.servicios.defaults);
    const storedServSet = new Set(storedServ.map(normSync));
    const nuevosServ = (cfg.servicios || []).filter(s => !storedServSet.has(normSync(s)));
    if (nuevosServ.length) {
      const activeServ = lsGet(div.servicios.lsKey + "_active", div.servicios.defaults);
      lsSet(div.servicios.lsKey, [...storedServ, ...nuevosServ]);
      lsSet(div.servicios.lsKey + "_active", [...activeServ, ...nuevosServ]);
      console.log(`[LEN] ${div.id}: ${nuevosServ.length} servicio(s) nuevo(s) sincronizado(s) desde backend →`, nuevosServ);
    }
  });
}

// ── Helpers búsqueda ──────────────────────────────────────────────────────
function normalizar(s) { return (s||"").toLowerCase().replace(/\s+/g," ").trim(); }
function deduplicar(arr) {
  const seen = new Set();
  return arr.filter(r => { const k=normalizar(r.titulo||""); if(seen.has(k)) return false; seen.add(k); return true; });
}
function parseFecha(str) {
  if(!str||str==="–") return null;
  if(str.includes("-") && str.length >= 10 && str[4]==="-") {
    // Parsear como fecha LOCAL, no UTC. "new Date('2026-07-13')" interpreta
    // la fecha en UTC medianoche, que en hora de Chile cae en el día anterior,
    // causando que licitaciones que cierran HOY se marquen como vencidas.
    const [y, m, d] = str.slice(0, 10).split("-").map(Number);
    return new Date(y, m - 1, d);
  }
  const p = str.split(/[-\/]/);
  if(p.length===3 && p[2].length===4) {
    return new Date(Number(p[2]), Number(p[1]) - 1, Number(p[0]));
  }
  return new Date(str);
}
function filtrarPorFecha(arr, soloVigentes, fechaInicio, fechaFin) {
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const DESDE_DEFAULT = new Date("2026-01-01");
  return arr.filter(r => {
    const cierre = parseFecha(r.fechaCierre);
    const pub    = parseFecha(r.fechaPublicacion);
    if(soloVigentes) {
      if(cierre) {
        const cierreDia = new Date(cierre); cierreDia.setHours(0,0,0,0);
        if(cierreDia < hoy) return false;
      }
    } else {
      if(fechaInicio || fechaFin) {
        const fi = fechaInicio ? new Date(fechaInicio) : null;
        const ff = fechaFin    ? new Date(fechaFin)    : null;
        if(ff) ff.setHours(23,59,59,999);
        if(fi) { const refInicio = pub || cierre; if(refInicio && refInicio < fi) return false; }
        if(ff && cierre && cierre > ff) return false;
      } else {
        const ref = pub || cierre;
        if(ref && ref < DESDE_DEFAULT) return false;
      }
    }
    return true;
  });
}

async function buscarEnBackend(tecnicas, servicios, regionDesde, regionHasta, signal) {
  const params = new URLSearchParams({ keywords: tecnicas.join(","), servicios: servicios.join(",") });
  if(regionDesde !== "todas") params.set("desde", regionDesde);
  if(regionHasta !== "todas") params.set("hasta", regionHasta);
  let res;
  try { res = await fetch(`${BACKEND_URL}/buscar?${params}`, {signal}); }
  catch(e) {
    if(e.name==="AbortError") throw e;
    throw new Error("No se pudo conectar al backend. Espera 30s y reintenta.");
  }
  if(!res.ok) throw new Error(`El backend respondió ${res.status}`);
  const data = await res.json();
  return (data.resultados||[]).map(r => ({...r, fuente:"Mercado Público"}));
}

        const actualizados = ds.results.map(r => {
          const d = data.resultados[r.codigo];
          return d ? { ...r, _enriching: false, region: d.region||r.region||"Región no disponible", organismo: d.organismo||r.organismo, monto: d.monto||r.monto, descripcion: d.descripcion||r.descripcion } : { ...r, _enriching: false };
        });
        if(!codigosValidos) return { ...ds, results: actualizados };
        const norm = s => s.toLowerCase().replace(/[áàä]/g,"a").replace(/[éèë]/g,"e").replace(/[íìï]/g,"i").replace(/[óòö]/g,"o").replace(/[úùü]/g,"u").replace(/ñ/g,"n").replace(/['''`´]/g,"").replace(/\s+/g," ").trim();
        const filtrados = actualizados.filter(r => {
          if(!r.region || r.region==="Región no disponible") return true;
          const reg = REGIONES.find(re => re.value !== "todas" && norm(r.region).includes(norm(re.label)));
          if(!reg) return true;
          return codigosValidos.has(reg.value);
        });
        return { ...ds, results: filtrados };
      });
    } catch(e) {
      console.error("[enriquecer] Error de red:", e.message);
      updateDs(divId, ds => ({ ...ds, results: ds.results.map(r => ({ ...r, _enriching: false })) }));
    }
  };

  const buscar = async () => {
    const divId = activeDivId2;
    const ds = divStates[divId];
    const tecnicas = ds.grupos.flatMap((g, i) => g.keywords.filter(k => g.active.has(k)));
    const servicios = ds.servicios.keywords.filter(k => ds.servicios.active.has(k));
    if(!tecnicas.length) {
      updateDs(divId, ds => ({ ...ds, error: "Selecciona al menos una keyword técnica." }));
      return;
    }
    updateDs(divId, ds => ({ ...ds, loading: true, error: "", steps: [], results: [], elapsed: 0 }));
    if(abortRefs.current[divId]) abortRefs.current[divId].abort();
    abortRefs.current[divId] = new AbortController();
    timerRefs.current[divId] = setInterval(() => {
      updateDs(divId, ds => ({ ...ds, elapsed: ds.elapsed + 1 }));
    }, 1000);
    const addStep = (msg, state="wait") => updateDs(divId, ds => ({ ...ds, steps: [...ds.steps, {msg, state}] }));
    try {
      addStep("Descargando licitaciones activas de Mercado Público...");
      // Refrescar códigos del gestor para que los badges estén actualizados
      refrescarCodigosGestor();
      const found = await buscarEnBackend(tecnicas, servicios, ds.regionDesde, ds.regionHasta, abortRefs.current[divId].signal);
      clearInterval(timerRefs.current[divId]);
      const filtradas = filtrarPorFecha(found, ds.soloVigentes, ds.fechaInicio, ds.fechaFin);
      const uniq = deduplicar(filtradas);
      if(uniq.length) {
        updateDs(divId, ds => ({ ...ds, loading: false, results: uniq, steps: [...ds.steps.slice(0,-1), {msg: `✅ ${uniq.length} licitaciones relevantes encontradas`, state:"ok"}] }));
        setHistory(prev => deduplicar([...uniq, ...prev]).slice(0, 100));
        setTab("resultados");
        setTimeout(() => enriquecerRegiones(uniq, divId), 500);
      } else {
        updateDs(divId, ds => ({ ...ds, loading: false, error: "Sin resultados. Prueba activando más keywords." }));
      }
    } catch(e) {
      clearInterval(timerRefs.current[divId]);
      updateDs(divId, ds => ({ ...ds, loading: false, error: e.name==="AbortError" ? "Búsqueda cancelada." : `Error: ${e.message}` }));
    }
  };

  const cancelar = () => {
    if(abortRefs.current[activeDivId2]) abortRefs.current[activeDivId2].abort();
    clearInterval(timerRefs.current[activeDivId2]);
    updateDs(activeDivId2, ds => ({ ...ds, loading: false }));
  };

  const verDetalle = async item => {
    setSelected(item);
    setAnalysis("⏳ Analizando con IA...");
    setAnalysisLoading(true);
    setAnalysisDescartado(false);
    setGestorEstado(null);
    setTab("detalle");
    await new Promise(r => setTimeout(r, 100));
    try {
      const res = await fetch(`${BACKEND_URL}/mp/analizar`, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({item}) });
      if(!res.ok) { const err=await res.json().catch(()=>({})); setAnalysis(`Error: ${err.error||res.status}`); setAnalysisLoading(false); return; }
      const data = await res.json();
      const texto = data.analysis || "No se pudo obtener el análisis.";
      setAnalysis(texto);
      // Si el backend descartó automáticamente por filtro MOP, marcar y NO guardar en gestor
      if(data.descartado === true) {
        setAnalysisDescartado(true);
        setAnalysisLoading(false);
        return;
      }
      const esParticpar = texto.includes("🟢");
      const esEvaluar   = texto.includes("🟡");
      if(esParticpar || esEvaluar) {
        try {
          // Pasar el análisis al gestor para guardarlo en BD junto con la licitación
          const itemConAnalisis = { ...item, analysis: texto };
          const gRes = await fetch(`${BACKEND_URL}/mp/guardar-gestor`, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({item: itemConAnalisis}) });
          const gData = await gRes.json();
          if(gData.ok) {
            setGestorEstado("guardado");
            refrescarCodigosGestor();
          }
          else if(gData.mensaje?.includes("ya existe")) setGestorEstado("duplicado");
          else setGestorEstado("error");
        } catch(e) { setGestorEstado("error"); }
      }
    } catch(e) { setAnalysis(`Error de conexión: ${e.message}`); }
    setAnalysisLoading(false);
  };

  // ── Búsqueda General (solo MP) ───────────────────────────────────────
  const buscarGeneral = async () => {
    setGeneralLoading(true);
    setGeneralProgress([]);
    setGeneralResults({});
    setActivePortal("home");
    if(generalAbortRef.current) generalAbortRef.current.abort();
    generalAbortRef.current = new AbortController();

    const addProg = (divId, msg, state="wait") => setGeneralProgress(prev => {
      const idx = prev.findIndex(p => p.divId === divId);
      if(idx >= 0) { const n=[...prev]; n[idx]={divId,msg,state}; return n; }
      return [...prev, {divId, msg, state}];
    });

    const nuevosResultados = {};

    addProg("mp_general", "🏛️ Descargando licitaciones de Mercado Público...", "wait");
    DIVISIONS.forEach(div => addProg(div.id, `${div.icon} ${div.label} — esperando...`, "wait"));

    try {
      const payload = DIVISIONS.map(div => {
        const ds = divStates[div.id];
        return {
          id:          div.id,
          keywords:    ds.grupos.flatMap(g => g.keywords.filter(k => g.active.has(k))),
          servicios:   ds.servicios.keywords.filter(k => ds.servicios.active.has(k)),
          regionDesde: ds.regionDesde,
          regionHasta: ds.regionHasta
        };
      }).filter(d => d.keywords.length > 0);

      const res = await fetch(`${BACKEND_URL}/buscar-general`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ divisiones: payload }),
        signal: generalAbortRef.current.signal
      });
      const rawTextMP = await res.text();
      if(!res.ok || rawTextMP.trim().startsWith("<")) {
        addProg("mp_general", `❌ MP — Error de conexión. Reintenta.`, "error");
        DIVISIONS.forEach(div => addProg(div.id, `${div.icon} ${div.label} — error`, "error"));
        throw new Error("Respuesta inválida del backend MP");
      }
      const data = JSON.parse(rawTextMP);

      addProg("mp_general", `🏛️ Mercado Público — ${data.total||0} licitaciones activas descargadas`, "ok");

      DIVISIONS.forEach(div => {
        const ds = divStates[div.id];
        const results = data.resultados?.[div.id] || [];
        const filtradas = filtrarPorFecha(results, soloVigentesGlobal, ds.fechaInicio, ds.fechaFin);
        nuevosResultados[div.id] = filtradas;
        addProg(div.id, `${div.icon} ${div.label} — ${filtradas.length} resultado(s)`, filtradas.length > 0 ? "ok" : "empty");
        if(filtradas.length) {
          setHistory(prev => deduplicar([...filtradas,...prev]).slice(0,100));
          updateDs(div.id, ds => ({...ds, results: filtradas}));
        }
      });

    } catch(e) {
      if(e.name === "AbortError") {
        DIVISIONS.forEach(div => addProg(div.id, `${div.icon} ${div.label} — cancelado`, "skip"));
      } else {
        addProg("mp_general", `❌ Error MP: ${e.message}`, "error");
      }
    }

    setGeneralResults(nuevosResultados);
    setGeneralLoading(false);
  };

  const cancelarGeneral = () => {
    if(generalAbortRef.current) generalAbortRef.current.abort();
    setGeneralLoading(false);
  };

  // ── Render ────────────────────────────────────────────────────────────
  const activDivConf = DIVISIONS.find(d => d.id === activeDivId2);
  const totalActive = ds.grupos.reduce((s, g) => s + [...g.active].filter(k => g.keywords.includes(k)).length, 0) + [...ds.servicios.active].filter(k => ds.servicios.keywords.includes(k)).length;
  const totalKws    = ds.grupos.reduce((s, g) => s + g.keywords.length, 0) + ds.servicios.keywords.length;

  return (
    <div style={{fontFamily:"system-ui,sans-serif",maxWidth:960,margin:"0 auto",padding:16,color:"#1e293b",background:"#f0f4f8",minHeight:"100vh"}}>

      {/* ── HEADER LEN ── */}
      <div style={{background:"#1E2D5A",padding:"14px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
        <div style={{display:"flex",alignItems:"center",gap:16}}>
          <img src={LEN_LOGO} alt="LEN Ingeniería" style={{height:52,borderRadius:8,background:"white",padding:"5px 10px",boxShadow:"0 2px 8px rgba(0,0,0,.3)"}}/>
          <div>
            <div style={{color:"white",fontSize:18,fontWeight:800,letterSpacing:.3}}>Agente de Licitaciones</div>
            <div style={{color:"rgba(255,255,255,.55)",fontSize:11,marginTop:2,letterSpacing:.5}}>LEN INGENIERÍA · CHILE · MERCADO PÚBLICO</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
          {/* Toggle global vigentes */}
          <div style={{display:"flex",alignItems:"center",gap:8,background:"rgba(255,255,255,.1)",borderRadius:8,padding:"6px 12px"}}>
            <span style={{color:"rgba(255,255,255,.8)",fontSize:12,fontWeight:600}}>Solo vigentes</span>
            <button onClick={() => {
              const nuevo = !soloVigentesGlobal;
              setSoloVigentesGlobal(nuevo);
              localStorage.setItem("global_solo_vigentes", JSON.stringify(nuevo));
            }} style={{
              width:42, height:22, borderRadius:11, border:"none", cursor:"pointer",
              background: soloVigentesGlobal ? "#F5B731" : "rgba(255,255,255,.3)",
              position:"relative", transition:"background .2s"
            }}>
              <div style={{
                width:16, height:16, borderRadius:"50%", background:"white",
                position:"absolute", top:3,
                left: soloVigentesGlobal ? 23 : 3,
                transition:"left .2s", boxShadow:"0 1px 3px rgba(0,0,0,.3)"
              }}/>
            </button>
          </div>
          <button onClick={generalLoading ? cancelarGeneral : buscarGeneral}
            style={{background:"#F5B731",color:"#1E2D5A",border:"none",padding:"10px 22px",borderRadius:10,fontSize:13,fontWeight:800,cursor:"pointer",transition:"all .15s",boxShadow:"0 2px 8px rgba(245,183,49,.4)",display:"flex",alignItems:"center",gap:8}}>
            {generalLoading ? "✕ Cancelar búsqueda" : "🔍 Búsqueda General"}
          </button>
        </div>
      </div>

      {/* ── PORTAL NAVIGATION ── */}
      <div className="portal-nav">
        <button className={`portal-tab ${activePortal==="home"?"active":""}`} onClick={() => setActivePortal("home")}>
          🏠 Inicio
        </button>
        <button className={`portal-tab ${activePortal==="mp"?"active":""}`} onClick={() => setActivePortal("mp")}>
          🏛️ LEN — Mercado Público
          {Object.values(divStates).reduce((s,d)=>s+d.results.length,0) > 0 &&
            <span className="ptag">{Object.values(divStates).reduce((s,d)=>s+d.results.length,0)}</span>}
        </button>
      </div>

      {/* ── PORTAL INICIO ── */}
      {activePortal==="home" && (
        <div style={{padding:"16px 0"}}>

          {/* Bienvenida / estado */}
          {!generalLoading && generalProgress.length===0 && (
            <div style={{background:"linear-gradient(135deg,#1E2D5A,#2d4a8a)",borderRadius:16,padding:"36px 32px",marginBottom:20,color:"white",textAlign:"center"}}>
              <div style={{fontSize:40,marginBottom:12}}>🔍</div>
              <div style={{fontSize:22,fontWeight:800,marginBottom:8}}>Agente de Licitaciones LEN</div>
              <div style={{fontSize:14,opacity:.75,marginBottom:24,maxWidth:480,margin:"0 auto 24px"}}>
                Busca en Mercado Público con keywords calibradas por las 7 divisiones de LEN
              </div>
              <button onClick={buscarGeneral}
                style={{background:"#F5B731",color:"#1E2D5A",border:"none",padding:"14px 36px",borderRadius:12,fontSize:16,fontWeight:800,cursor:"pointer",boxShadow:"0 4px 16px rgba(245,183,49,.5)"}}>
                🚀 Iniciar Búsqueda General
              </button>
              <div style={{marginTop:14,fontSize:12,opacity:.6}}>
                {soloVigentesGlobal ? "✅ Modo: solo licitaciones vigentes" : "📋 Modo: todas las licitaciones"}
              </div>
            </div>
          )}

          {/* Progreso búsqueda general */}
          {(generalLoading || generalProgress.length > 0) && (
            <div style={{background:"white",borderRadius:12,padding:"20px 24px",marginBottom:16,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
                <div style={{fontWeight:700,fontSize:15}}>
                  {generalLoading ? "⏳ Buscando en Mercado Público..." : "✅ Búsqueda completada"}
                </div>
                {generalLoading && (
                  <button onClick={cancelarGeneral} style={{background:"#fee2e2",color:"#dc2626",border:"none",padding:"6px 14px",borderRadius:6,fontSize:12,cursor:"pointer",fontWeight:600}}>
                    ✕ Cancelar
                  </button>
                )}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:8}}>
                {generalProgress.map((p,i) => {
                  const div = DIVISIONS.find(d=>d.id===p.divId);
                  const isMp = p.divId==="mp_general";
                  const bg   = p.state==="ok"?"#f0fdf4":p.state==="empty"?"#f8fafc":p.state==="error"?"#fef2f2":p.state==="skip"?"#f8fafc":"#eff6ff";
                  const color= p.state==="ok"?"#15803d":p.state==="empty"?"#94a3b8":p.state==="error"?"#dc2626":p.state==="skip"?"#94a3b8":div?.color||"#2563eb";
                  const icon = p.state==="ok"?"✅":p.state==="empty"?"⚪":p.state==="error"?"❌":p.state==="skip"?"—":"⏳";
                  if(isMp) return (
                    <div key={i} style={{gridColumn:"1/-1",background:bg,border:`1px solid ${color}22`,borderRadius:8,padding:"8px 12px",fontSize:12,color,display:"flex",gap:6,alignItems:"center"}}>
                      <span>{icon}</span><span>{p.msg}</span>
                    </div>
                  );
                  return (
                    <div key={i} style={{background:bg,border:`1px solid ${color}22`,borderRadius:8,padding:"8px 12px",fontSize:12,color,display:"flex",gap:6,alignItems:"center"}}>
                      <span>{icon}</span><span style={{flex:1}}>{p.msg}</span>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* Dashboard de resultados */}
          {Object.keys(generalResults).length > 0 && !generalLoading && (
            <>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                <div style={{fontWeight:700,fontSize:14,color:"#1e293b"}}>
                  📊 Resultados — {new Date().toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long"})}
                </div>
                <div style={{fontSize:13,color:"#2563eb",fontWeight:700}}>
                  Total: {Object.values(generalResults).reduce((s,r)=>s+r.length,0)} licitaciones
                </div>
              </div>

              {/* LEN — Mercado Público */}
              <div style={{marginBottom:20}}>
                <div style={{fontSize:11,fontWeight:700,color:"#64748b",textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>🏛️ LEN — Mercado Público</div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:8}}>
                  {DIVISIONS.filter(div => div.activa !== false).map(div => {
                    const count = (generalResults[div.id]||[]).length;
                    return (
                      <button key={div.id}
                        onClick={() => { setActiveDivId(div.id); setActivePortal("mp"); setTab("resultados"); }}
                        style={{background:count>0?div.bg:"#f8fafc",border:`2px solid ${count>0?div.color:"#e2e8f0"}`,borderRadius:10,padding:"12px 14px",cursor:count>0?"pointer":"default",textAlign:"left",transition:"all .15s",opacity:count>0?1:.6}}>
                        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
                          <span style={{fontSize:18}}>{div.icon}</span>
                          <span style={{fontWeight:700,fontSize:12,color:count>0?div.color:"#94a3b8",flex:1}}>{div.label}</span>
                          <span style={{background:count>0?div.color:"#e2e8f0",color:count>0?"white":"#94a3b8",fontSize:12,fontWeight:800,padding:"2px 8px",borderRadius:99,minWidth:24,textAlign:"center"}}>{count}</span>
                        </div>
                        <div style={{fontSize:10,color:count>0?"#64748b":"#cbd5e1"}}>
                          {count>0?"Clic para ver resultados →":"Sin resultados"}
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Botón nueva búsqueda */}
              <div style={{textAlign:"center",marginTop:24}}>
                <button onClick={buscarGeneral}
                  style={{background:"#1E2D5A",color:"white",border:"none",padding:"12px 28px",borderRadius:10,fontSize:14,fontWeight:700,cursor:"pointer"}}>
                  🔄 Nueva Búsqueda General
                </button>
              </div>
            </>
          )}
        </div>
      )}

      {/* ── PORTAL MP ── */}
      {activePortal==="mp" && <>
      {/* Tabs de divisiones (solo las activas) */}
      <div style={{background:"white",borderRadius:12,padding:6,marginBottom:16,display:"flex",flexWrap:"wrap",gap:4,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
        {DIVISIONS.filter(div => div.activa !== false).map(div => {
          const isActive = div.id === activeDivId2;
          const divResults = divStates[div.id].results.length;
          return (
            <button key={div.id} onClick={() => { setActiveDivId(div.id); setTab("resultados"); }}
              style={{flex:"1 1 auto",padding:"10px 12px",borderRadius:8,border:`2px solid ${isActive ? div.color : "transparent"}`,cursor:"pointer",fontSize:13,fontWeight:700,background:isActive ? div.bg : "transparent",color:isActive ? div.color : "#64748b",transition:"all .15s",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
              <span>{div.icon}</span>
              <span>{div.label}</span>
              {divResults > 0 && <span style={{background:isActive?div.color:"#e2e8f0",color:isActive?"white":"#64748b",fontSize:10,fontWeight:700,padding:"1px 6px",borderRadius:99}}>{divResults}</span>}
            </button>
          );
        })}
      </div>

      {/* Sub-tabs */}
      <div style={{display:"flex",gap:6,marginBottom:16,flexWrap:"wrap"}}>
        {[
          ["resultados", `📋 Resultados (${ds.results.length})`],
          ["detalle",    "📄 Análisis IA"],
          ["historial",  `🕐 Historial (${history.length})`],
          ["buscar",     "⚙️ Configuración"],
        ].map(([k,l]) => (
          <button key={k} onClick={() => setTab(k)} style={{padding:"8px 16px",borderRadius:8,border:"none",cursor:"pointer",fontSize:13,fontWeight:600,background:tab===k ? activDivConf.color : "white",color:tab===k ? "white":"#475569",boxShadow:"0 1px 3px rgba(0,0,0,.08)"}}>
            {l}
          </button>
        ))}
      </div>

      {/* Tab: Buscar */}
      {tab==="buscar" && (
        <div style={{display:"flex",flexDirection:"column",gap:14}}>

          {/* Keywords */}
          <div style={{background:"white",borderRadius:12,padding:20,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <div style={{fontWeight:700,fontSize:14}}>🏷️ Palabras clave — {activDivConf.label}</div>
              <div style={{fontSize:12,color:"#64748b"}}><b style={{color:totalActive===totalKws?"#16a34a":"#ea580c"}}>{totalActive}</b> / {totalKws} activas</div>
            </div>

            {/* Grupos técnicos */}
            {ds.grupos.map((grupo, gi) => {
              const grupConf = activDivConf.grupos[gi];
              return (
                <div key={gi} style={{marginBottom:16}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                    <span style={{fontSize:11,fontWeight:700,color:grupConf.color,textTransform:"uppercase",letterSpacing:1}}>{grupConf.label}</span>
                    <button onClick={() => toggleGroup(activeDivId2,"tecnica",gi)} style={{fontSize:10,padding:"2px 8px",borderRadius:10,border:`1px solid ${grupConf.border}`,background:grupConf.bg,color:grupConf.color,cursor:"pointer",fontWeight:600}}>
                      {grupo.keywords.every(k=>grupo.active.has(k))?"Desactivar todos":"Activar todos"}
                    </button>
                  </div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}}>
                    {grupo.keywords.map(kw => {
                      const on = grupo.active.has(kw);
                      return (
                        <div key={kw} style={{display:"flex",alignItems:"center",borderRadius:20,border:`2px solid ${on?grupConf.color:"#e2e8f0"}`,background:on?grupConf.color+"18":"#f8fafc",overflow:"hidden"}}>
                          <button onClick={() => toggleKw(activeDivId2,"tecnica",gi,kw)} style={{padding:"4px 10px",fontSize:12,cursor:"pointer",fontWeight:600,background:"transparent",border:"none",color:on?grupConf.color:"#94a3b8"}}>
                            {on?"✓ ":""}{kw}
                          </button>
                          <button onClick={() => removeKw(activeDivId2,"tecnica",gi,kw)} style={{padding:"4px 7px 4px 2px",fontSize:11,cursor:"pointer",background:"transparent",border:"none",color:"#94a3b8"}} title="Eliminar">✕</button>
                        </div>
                      );
                    })}
                  </div>
                  <div style={{display:"flex",gap:6}}>
                    <input value={grupo.newInput||""} onChange={e => setInput(activeDivId2,"tecnica",gi,e.target.value)}
                      onKeyDown={e => e.key==="Enter" && addKw(activeDivId2,"tecnica",gi,grupo.newInput||"")}
                      placeholder={`Agregar keyword de ${grupConf.label.toLowerCase()}...`}
                      style={{flex:1,padding:"7px 12px",borderRadius:8,border:"1px dashed #cbd5e1",fontSize:12,outline:"none",background:"#fafafa"}}/>
                    <button onClick={() => addKw(activeDivId2,"tecnica",gi,grupo.newInput||"")}
                      style={{padding:"7px 14px",borderRadius:8,background:grupConf.bg,color:grupConf.color,border:`1px solid ${grupConf.border}`,fontSize:12,fontWeight:700,cursor:"pointer"}}>+ Agregar</button>
                  </div>
                </div>
              );
            })}

            {/* Tipo de servicio */}
            <div style={{marginBottom:4}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                <span style={{fontSize:11,fontWeight:700,color:"#16a34a",textTransform:"uppercase",letterSpacing:1}}>Tipo de Servicio</span>
                <button onClick={() => toggleGroup(activeDivId2,"servicio",0)} style={{fontSize:10,padding:"2px 8px",borderRadius:10,border:"1px solid #bbf7d0",background:"#f0fdf4",color:"#16a34a",cursor:"pointer",fontWeight:600}}>
                  {ds.servicios.keywords.every(k=>ds.servicios.active.has(k))?"Desactivar todos":"Activar todos"}
                </button>
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}}>
                {ds.servicios.keywords.map(kw => {
                  const on = ds.servicios.active.has(kw);
                  return (
                    <div key={kw} style={{display:"flex",alignItems:"center",borderRadius:20,border:`2px solid ${on?"#16a34a":"#e2e8f0"}`,background:on?"#16a34a18":"#f8fafc",overflow:"hidden"}}>
                      <button onClick={() => toggleKw(activeDivId2,"servicio",0,kw)} style={{padding:"4px 10px",fontSize:12,cursor:"pointer",fontWeight:600,background:"transparent",border:"none",color:on?"#16a34a":"#94a3b8"}}>
                        {on?"✓ ":""}{kw}
                      </button>
                      <button onClick={() => removeKw(activeDivId2,"servicio",0,kw)} style={{padding:"4px 7px 4px 2px",fontSize:11,cursor:"pointer",background:"transparent",border:"none",color:"#94a3b8"}} title="Eliminar">✕</button>
                    </div>
                  );
                })}
              </div>
              <div style={{display:"flex",gap:6}}>
                <input value={ds.servicios.newInput||""} onChange={e => setInput(activeDivId2,"servicio",0,e.target.value)}
                  onKeyDown={e => e.key==="Enter" && addKw(activeDivId2,"servicio",0,ds.servicios.newInput||"")}
                  placeholder="Agregar tipo de servicio..."
                  style={{flex:1,padding:"7px 12px",borderRadius:8,border:"1px dashed #cbd5e1",fontSize:12,outline:"none",background:"#fafafa"}}/>
                <button onClick={() => addKw(activeDivId2,"servicio",0,ds.servicios.newInput||"")}
                  style={{padding:"7px 14px",borderRadius:8,background:"#f0fdf4",color:"#16a34a",border:"1px solid #bbf7d0",fontSize:12,fontWeight:700,cursor:"pointer"}}>+ Agregar</button>
              </div>
            </div>
          </div>

          {/* Regiones */}
          <div style={{background:"white",borderRadius:12,padding:20,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
            <div style={{fontWeight:700,fontSize:14,marginBottom:12}}>📍 Rango de regiones</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr auto 1fr",gap:12,alignItems:"end"}}>
              <div>
                <div style={{fontSize:12,fontWeight:600,color:"#64748b",marginBottom:6}}>Desde</div>
                <select value={ds.regionDesde} onChange={e => { lsSet("region_desde_"+activeDivId2, e.target.value); updateDs(activeDivId2, ds => ({...ds, regionDesde: e.target.value})); }}
                  style={{width:"100%",padding:"10px 12px",borderRadius:8,border:"1px solid #cbd5e1",fontSize:13,background:"white"}}>
                  {REGIONES.map(r => <option key={r.value} value={r.value}>{r.label}</option>)}
                </select>
              </div>
              <div style={{fontSize:18,color:"#94a3b8",paddingBottom:8,textAlign:"center"}}>→</div>
              <div>
                <div style={{fontSize:12,fontWeight:600,color:"#64748b",marginBottom:6}}>Hasta</div>
                <select value={ds.regionHasta} onChange={e => { lsSet("region_hasta_"+activeDivId2, e.target.value); updateDs(activeDivId2, ds => ({...ds, regionHasta: e.target.value})); }}
                  style={{width:"100%",padding:"10px 12px",borderRadius:8,border:"1px solid #cbd5e1",fontSize:13,background:"white"}}>
                  {REGIONES.map(r => <option key={r.value} value={r.value}>{r.label}</option>)}
                </select>
              </div>
            </div>
          </div>

          {/* Fechas */}
          <div style={{background:"white",borderRadius:12,padding:20,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
            <div style={{fontWeight:700,fontSize:14,marginBottom:12}}>📅 Filtro de fechas</div>
            <div style={{display:"flex",gap:8,marginBottom:12}}>
              <button onClick={() => updateDs(activeDivId2, ds => ({...ds, soloVigentes:true, fechaInicio:new Date().toISOString().split("T")[0], fechaFin:""}))}
                style={{flex:1,padding:"9px 0",borderRadius:8,border:"2px solid",fontSize:13,fontWeight:600,cursor:"pointer",borderColor:ds.soloVigentes?"#2563eb":"#e2e8f0",background:ds.soloVigentes?"#eff6ff":"white",color:ds.soloVigentes?"#2563eb":"#94a3b8"}}>
                ✅ Solo vigentes
              </button>
              <button onClick={() => updateDs(activeDivId2, ds => ({...ds, soloVigentes:false, fechaInicio:"", fechaFin:""}))}
                style={{flex:1,padding:"9px 0",borderRadius:8,border:"2px solid",fontSize:13,fontWeight:600,cursor:"pointer",borderColor:!ds.soloVigentes?"#2563eb":"#e2e8f0",background:!ds.soloVigentes?"#eff6ff":"white",color:!ds.soloVigentes?"#2563eb":"#94a3b8"}}>
                📅 Rango manual
              </button>
            </div>
            {ds.soloVigentes
              ? <div style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:8,padding:"10px 14px",fontSize:12,color:"#15803d"}}>✅ Licitaciones con cierre igual o posterior a hoy (<b>{new Date().toLocaleDateString("es-CL")}</b>).</div>
              : <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                  <div>
                    <div style={{fontSize:12,fontWeight:600,color:"#64748b",marginBottom:6}}>Fecha inicio publicación</div>
                    <input type="date" value={ds.fechaInicio} onChange={e => updateDs(activeDivId2, ds => ({...ds, fechaInicio:e.target.value}))}
                      style={{width:"100%",padding:"10px 12px",borderRadius:8,border:"1px solid #cbd5e1",fontSize:13}}/>
                  </div>
                  <div>
                    <div style={{fontSize:12,fontWeight:600,color:"#64748b",marginBottom:6}}>Fecha fin cierre</div>
                    <input type="date" value={ds.fechaFin} onChange={e => updateDs(activeDivId2, ds => ({...ds, fechaFin:e.target.value}))}
                      style={{width:"100%",padding:"10px 12px",borderRadius:8,border:"1px solid #cbd5e1",fontSize:13}}/>
                  </div>
                </div>
            }
          </div>

          {/* Botón buscar */}
          <div style={{background:"white",borderRadius:12,padding:20,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
            <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
              <button onClick={buscar} disabled={ds.loading}
                style={{background:ds.loading?"#94a3b8":activDivConf.color,color:"white",border:"none",padding:"12px 32px",borderRadius:8,fontSize:15,fontWeight:700,cursor:ds.loading?"not-allowed":"pointer",boxShadow:ds.loading?"none":`0 2px 8px ${activDivConf.color}55`}}>
                {ds.loading ? `⏳ Buscando... ${ds.elapsed}s` : "🚀 Buscar Licitaciones"}
              </button>
              {ds.loading && <button onClick={cancelar} style={{background:"#fee2e2",color:"#dc2626",border:"none",padding:"12px 20px",borderRadius:8,fontSize:14,fontWeight:600,cursor:"pointer"}}>✕ Cancelar</button>}
            </div>
            {ds.error && <div style={{marginTop:12,background:"#fef2f2",border:"1px solid #fecaca",borderRadius:8,padding:"10px 14px",fontSize:13,color:"#dc2626"}}>⚠️ {ds.error}</div>}
            {ds.steps.length > 0 && (
              <div style={{marginTop:16}}>
                <div style={{fontSize:12,fontWeight:700,color:"#64748b",marginBottom:8}}>Progreso de búsqueda</div>
                {ds.steps.map((s,i) => (
                  <div key={i} style={{fontSize:12,color:s.state==="ok"?"#15803d":s.state==="empty"?"#94a3b8":"#2563eb",display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
                    <span>{s.state==="wait"?"⏳":s.state==="ok"?"✅":"⚪"}</span><span>{s.msg}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}

      {/* Tab: Resultados */}
      {tab==="resultados" && (
        <div>
          {ds.results.length===0
            ? <div style={{textAlign:"center",color:"#94a3b8",padding:48,background:"white",borderRadius:12}}>Sin resultados para {activDivConf.label}. Realiza una búsqueda primero.</div>
            : (() => {
                // Calcular cuántas son de cada estado para los contadores del header
                const stats = { nueva: 0, activa: 0, descartada: 0 };
                ds.results.forEach(r => { stats[getEstadoEnGestor(r.codigo)]++; });
                // Aplicar filtro "solo nuevas" si está activo
                const visiblesPreBusqueda = soloNuevas
                  ? ds.results.filter(r => getEstadoEnGestor(r.codigo) === 'nueva')
                  : ds.results;
                // Aplicar búsqueda libre por código o nombre (ignora
                // mayúsculas/acentos), sobre lo que ya pasó el filtro anterior.
                const normBusqueda = s => (s||"").toLowerCase()
                  .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
                const textoBusqueda = normBusqueda(busquedaTexto.trim());
                const visibles = textoBusqueda
                  ? visiblesPreBusqueda.filter(r =>
                      normBusqueda(r.codigo).includes(textoBusqueda) ||
                      normBusqueda(r.titulo).includes(textoBusqueda)
                    )
                  : visiblesPreBusqueda;
                return <>
                <div style={{fontSize:13,color:"#64748b",marginBottom:12,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                  <span style={{background:activDivConf.bg,color:activDivConf.color,padding:"3px 10px",borderRadius:99,fontSize:11,fontWeight:700}}>{activDivConf.icon} {activDivConf.label}</span>
                  <span><strong>{ds.results.length}</strong> licitaciones encontradas</span>
                  {stats.nueva > 0 && <span style={{background:"#dcfce7",color:"#15803d",padding:"3px 10px",borderRadius:99,fontSize:11,fontWeight:700}}>🆕 {stats.nueva} nueva{stats.nueva===1?'':'s'}</span>}
                  {stats.activa > 0 && <span style={{background:"#f1f5f9",color:"#64748b",padding:"3px 10px",borderRadius:99,fontSize:11,fontWeight:600}}>✓ {stats.activa} en gestor</span>}
                  {stats.descartada > 0 && <span style={{background:"#fef2f2",color:"#b91c1c",padding:"3px 10px",borderRadius:99,fontSize:11,fontWeight:600}}>🚫 {stats.descartada} descartada{stats.descartada===1?'':'s'}</span>}
                  {stats.nueva > 0 && (() => {
                    const sinTriar = ds.results.filter(r => r.codigo && getEstadoEnGestor(r.codigo)==='nueva' && !triajes.has(r.codigo)).length;
                    if (sinTriar === 0) return null;
                    return (
                      <button onClick={dispararTriaje} disabled={triajeLoading}
                        style={{background: triajeLoading?"#cbd5e1":"#1E2D5A", color:"white", border:"none", padding:"5px 12px", borderRadius:99, fontSize:11, fontWeight:700, cursor: triajeLoading?"wait":"pointer"}}>
                        {triajeLoading ? "⏳ Analizando..." : `🔍 Triaje (${sinTriar} nuevas)`}
                      </button>
                    );
                  })()}
                  <label style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",marginLeft:"auto",fontSize:12,color:"#475569",userSelect:"none"}}>
                    <input type="checkbox" checked={soloNuevas} onChange={e => setSoloNuevas(e.target.checked)} style={{cursor:"pointer"}} />
                    Solo nuevas
                  </label>
                </div>
                <div style={{marginBottom:12,position:"relative"}}>
                  <input
                    type="text"
                    value={busquedaTexto}
                    onChange={e => setBusquedaTexto(e.target.value)}
                    placeholder="🔎 Buscar por código o nombre de licitación..."
                    style={{width:"100%",padding:"9px 36px 9px 14px",borderRadius:8,border:"1px solid #cbd5e1",fontSize:13,outline:"none",boxSizing:"border-box"}}
                  />
                  {busquedaTexto && (
                    <button onClick={() => setBusquedaTexto("")}
                      style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",background:"transparent",border:"none",cursor:"pointer",fontSize:14,color:"#94a3b8"}}
                      title="Limpiar búsqueda">✕</button>
                  )}
                  {textoBusqueda && (
                    <div style={{fontSize:11,color:"#64748b",marginTop:4}}>
                      {visibles.length} resultado{visibles.length===1?"":"s"} para "{busquedaTexto}"
                    </div>
                  )}
                </div>
                {visibles.length === 0 && soloNuevas && !textoBusqueda && (
                  <div style={{textAlign:"center",color:"#94a3b8",padding:24,background:"white",borderRadius:8,border:"1px dashed #e2e8f0",fontSize:13}}>
                    Todas las licitaciones encontradas ya están en el gestor 🎉<br/>
                    <span style={{fontSize:11,color:"#cbd5e1"}}>Desactivá "Solo nuevas" para verlas todas</span>
                  </div>
                )}
                {visibles.length === 0 && textoBusqueda && (
                  <div style={{textAlign:"center",color:"#94a3b8",padding:24,background:"white",borderRadius:8,border:"1px dashed #e2e8f0",fontSize:13}}>
                    Sin resultados para "{busquedaTexto}" en {activDivConf.label}
                  </div>
                )}
                {visibles.map((r,i) => {
                  const estadoGestor = getEstadoEnGestor(r.codigo);
                  // Configuración visual según estado
                  const cardCfg = {
                    nueva:      { borderColor:'#bbf7d0', opacity:1,    badge:{ bg:"#15803d",   color:"white",   text:"🆕 Nueva",      shadow:"0 1px 3px rgba(21,128,61,.3)" } },
                    activa:     { borderColor:'#e2e8f0', opacity:1,    badge:{ bg:"#f1f5f9",   color:"#64748b", text:"✓ En gestor",   shadow:"none" } },
                    descartada: { borderColor:'#fecaca', opacity:0.65, badge:{ bg:"#fef2f2",   color:"#b91c1c", text:"🚫 Descartada", shadow:"none" } }
                  }[estadoGestor];
                  return (
                  <div key={i} style={{background:"white",border:`1px solid ${cardCfg.borderColor}`,borderRadius:10,padding:16,marginBottom:10,boxShadow:"0 1px 3px rgba(0,0,0,.05)",opacity:cardCfg.opacity}}>
                    <div style={{display:"flex",gap:6,marginBottom:8,flexWrap:"wrap",alignItems:"center"}}>
                      <span style={{background:cardCfg.badge.bg,color:cardCfg.badge.color,fontSize:11,padding:"3px 10px",borderRadius:12,fontWeight:700,boxShadow:cardCfg.badge.shadow}}>{cardCfg.badge.text}</span>
                      {(() => {
                        // Badge de triaje (solo para las nuevas que ya fueron triadas)
                        if (estadoGestor !== 'nueva') return null;
                        const t = triajes.get(r.codigo);
                        if (!t) return null;
                        const triajeCfg = {
                          "🟢": { bg:"#dcfce7", color:"#15803d", border:"#86efac" },
                          "🟡": { bg:"#fef3c7", color:"#a16207", border:"#fde68a" },
                          "🔴": { bg:"#fee2e2", color:"#b91c1c", border:"#fca5a5" },
                          "⚪": { bg:"#f1f5f9", color:"#64748b", border:"#cbd5e1" }
                        }[t.veredicto] || { bg:"#f1f5f9", color:"#64748b", border:"#cbd5e1" };
                        return (
                          <span title={t.razon} style={{background:triajeCfg.bg, color:triajeCfg.color, border:`1px solid ${triajeCfg.border}`, fontSize:11, padding:"2px 8px", borderRadius:12, fontWeight:700, cursor:"help"}}>
                            {t.veredicto} {t.razon ? t.razon.substring(0, 50) + (t.razon.length > 50 ? "…" : "") : ""}
                          </span>
                        );
                      })()}
                      <span style={{background:"#eff6ff",color:"#2563eb",fontSize:11,padding:"2px 8px",borderRadius:12,fontWeight:600}}>🏛️ Mercado Público</span>
                      {r.estado && <span style={{background:"#f0fdf4",color:"#15803d",fontSize:11,padding:"2px 8px",borderRadius:12,fontWeight:600}}>● {r.estado}</span>}
                      <span style={{background:"#fefce8",color:"#854d0e",fontSize:11,padding:"2px 8px",borderRadius:12,fontWeight:600}}>📍 {r.region||"Cargando región..."}</span>
                    </div>
                    {r.divisiones && r.divisiones.length > 0 && <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:4}}>{r.divisiones.map((d,i)=><span key={i} style={{background:d.color+"18",color:d.color,border:`1px solid ${d.color}44`,fontSize:10,padding:"1px 7px",borderRadius:99,fontWeight:700}}>{d.icon} {d.label}</span>)}</div>}
                    <div style={{fontWeight:700,fontSize:14,marginBottom:4,lineHeight:1.4}}>{r.titulo||"Sin título"}</div>
                    <div style={{fontSize:12,color:"#64748b",marginBottom:4}}>{r.organismo}</div>
                    {r.codigo && <div style={{fontSize:11,color:"#94a3b8",marginBottom:4}}>Código: {r.codigo}</div>}
                    <div style={{display:"flex",gap:16,fontSize:12,color:"#94a3b8",flexWrap:"wrap"}}>
                      {r.fechaPublicacion && <span>📅 {r.fechaPublicacion}</span>}
                      {r.fechaCierre      && <span>⏰ Cierre: {r.fechaCierre}</span>}
                      {r.monto            && <span>💰 {r.monto}</span>}
                    </div>
                    {r.descripcion ? (
                      <div style={{
                        fontSize:12.5, color:"#334155", marginTop:10, lineHeight:1.55,
                        background:"#f8fafc", padding:"8px 12px", borderRadius:6,
                        borderLeft:"3px solid #cbd5e1",
                        display:"-webkit-box", WebkitLineClamp:4, WebkitBoxOrient:"vertical",
                        overflow:"hidden", textOverflow:"ellipsis"
                      }}>{r.descripcion}</div>
                    ) : r._enriching ? (
                      <div style={{
                        fontSize:12, color:"#94a3b8", marginTop:10, lineHeight:1.55,
                        background:"#f8fafc", padding:"8px 12px", borderRadius:6,
                        borderLeft:"3px solid #e2e8f0", fontStyle:"italic"
                      }}>⏳ Cargando descripción del proyecto...</div>
                    ) : null}
                    <div style={{display:"flex",gap:8,marginTop:10,flexWrap:"wrap"}}>
                      <button onClick={() => verDetalle(r)} style={{background:"#eff6ff",color:"#2563eb",border:"none",padding:"6px 14px",borderRadius:6,fontSize:12,cursor:"pointer",fontWeight:600}}>🤖 Analizar con IA</button>
                      {r.url && <a href={r.url} target="_blank" rel="noreferrer" style={{background:"#f8fafc",color:"#475569",border:"1px solid #e2e8f0",padding:"6px 14px",borderRadius:6,fontSize:12,fontWeight:600}}>🔗 Ver en MP</a>}
                    </div>
                  </div>
                  );
                })}
              </>;
              })()
          }
        </div>
      )}

      {/* Tab: Análisis IA */}
      {tab==="detalle" && (
        <div>
          {!selected
            ? <div style={{textAlign:"center",color:"#94a3b8",padding:48,background:"white",borderRadius:12}}>Selecciona una licitación desde Resultados para analizarla.</div>
            : <div style={{background:"white",borderRadius:12,padding:24,boxShadow:"0 1px 4px rgba(0,0,0,.07)",borderLeft: analysisDescartado ? "5px solid #dc2626" : "none"}}>
                <div style={{fontWeight:800,fontSize:15,marginBottom:4, textDecoration: analysisDescartado ? "line-through" : "none", color: analysisDescartado ? "#94a3b8" : "#1e293b"}}>{selected.titulo}</div>
                <div style={{fontSize:12,color:"#64748b",marginBottom:8}}>{selected.organismo} · Código: {selected.codigo||"N/A"}</div>
                {analysisDescartado && (
                  <div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:8,padding:"10px 14px",fontSize:12,color:"#dc2626",marginBottom:12,fontWeight:600}}>
                    🔴 Esta licitación fue descartada automáticamente — LEN no cumple con las especialidades del Registro MOP requeridas. No se realizó análisis IA para no consumir tokens.
                  </div>
                )}
                {!analysisDescartado && gestorEstado==="guardado"  && <div style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:8,padding:"8px 14px",fontSize:12,color:"#15803d",marginBottom:12}}>✅ Enviada al Gestor automáticamente</div>}
                {!analysisDescartado && gestorEstado==="duplicado" && <div style={{background:"#fefce8",border:"1px solid #fef08a",borderRadius:8,padding:"8px 14px",fontSize:12,color:"#854d0e",marginBottom:12}}>⚠️ Ya estaba en el Gestor</div>}
                {!analysisDescartado && gestorEstado==="error"     && <div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:8,padding:"8px 14px",fontSize:12,color:"#dc2626",marginBottom:12}}>❌ No se pudo guardar — agrégala manualmente</div>}
                <div style={{borderTop:"1px solid #e2e8f0",paddingTop:16}}>
                  <div style={{fontWeight:700,fontSize:13,marginBottom:14,color: analysisDescartado ? "#dc2626" : "#2563eb"}}>
                    {analysisDescartado ? "🔴 Resultado del filtro automático" : "🤖 Análisis de Factibilidad"}
                  </div>
                  {analysisLoading
                    ? <div style={{color:"#2563eb",fontSize:14,padding:"20px 0"}}>⏳ Analizando con IA...</div>
                    : <AnalysisRenderer text={analysis} descartado={analysisDescartado} />
                  }
                </div>
                {selected.url && <div style={{marginTop:20}}><a href={selected.url} target="_blank" rel="noreferrer" style={{background:"#eff6ff",color:"#2563eb",padding:"10px 20px",borderRadius:8,fontSize:13,fontWeight:600}}>🔗 Abrir en Mercado Público</a></div>}
              </div>
          }
        </div>
      )}


      {/* Tab: Historial */}
      {tab==="historial" && (
        <div>
          {history.length===0
            ? <div style={{textAlign:"center",color:"#94a3b8",padding:48,background:"white",borderRadius:12}}>Sin historial aún.</div>
            : <>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                  <div style={{fontSize:13,color:"#64748b"}}>{history.length} licitaciones guardadas</div>
                  <button onClick={() => setHistory([])} style={{background:"#fee2e2",color:"#dc2626",border:"none",padding:"6px 14px",borderRadius:6,fontSize:12,cursor:"pointer",fontWeight:600}}>🗑️ Limpiar</button>
                </div>
                {history.map((r,i) => (
                  <div key={i} style={{background:"white",border:"1px solid #e2e8f0",borderRadius:8,padding:12,marginBottom:8}}>
                    <div style={{display:"flex",gap:6,marginBottom:4,flexWrap:"wrap"}}>
                      {r.estado && <span style={{background:"#f0fdf4",color:"#15803d",fontSize:11,padding:"2px 8px",borderRadius:12,fontWeight:600}}>● {r.estado}</span>}
                      <span style={{background:"#fefce8",color:"#854d0e",fontSize:11,padding:"2px 8px",borderRadius:12,fontWeight:600}}>📍 {r.region||"Región no disponible"}</span>
                    </div>
                    <div style={{fontWeight:600,fontSize:13}}>{r.titulo}</div>
                    <div style={{fontSize:11,color:"#94a3b8",marginTop:3}}>{r.organismo}{r.fechaCierre?` · Cierre: ${r.fechaCierre}`:""}</div>
                    <button onClick={() => verDetalle(r)} style={{background:"#eff6ff",color:"#2563eb",border:"none",padding:"4px 10px",borderRadius:6,fontSize:11,cursor:"pointer",marginTop:8,fontWeight:600}}>🤖 Analizar</button>
                  </div>
                ))}
              </>
          }
        </div>
      )}
      </> /* fin portal MP */}

    </div>
  );
}

// ── Renderizador del análisis IA ──────────────────────────────────────────
function AnalysisRenderer({ text, descartado }) {
  if (!text) return null;
  // Si fue descartado, mostrar el texto crudo del backend (ya viene con formato propio)
  if (descartado) {
    return (
      <div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:10,padding:"16px 18px",fontSize:13,lineHeight:1.7,color:"#7f1d1d",whiteSpace:"pre-wrap",fontFamily:"system-ui,sans-serif"}}>
        {text}
      </div>
    );
  }
  const esParticipar = text.includes("🟢");
  const esEvaluar    = text.includes("🟡");
  const esDescartar  = text.includes("🔴");
  const veredictoColor = esParticipar ? "#f0fdf4" : esEvaluar ? "#fefce8" : esDescartar ? "#fef2f2" : "#f8fafc";
  const veredictoB    = esParticipar ? "#bbf7d0" : esEvaluar ? "#fef08a" : esDescartar ? "#fecaca" : "#e2e8f0";
  const veredictoText = esParticipar ? "#15803d" : esEvaluar ? "#854d0e" : esDescartar ? "#dc2626" : "#475569";
  const parseTabla = (bloque) => {
    const lineas = bloque.split("\n").filter(l => l.includes("|"));
    const filas  = lineas.map(l => l.split("|").map(c => c.trim()).filter(Boolean)).filter(f => f.length >= 2 && !f.every(c => c.match(/^[-\s]+$/)));
    if (!filas.length) return null;
    const encabezado = filas[0];
    const datos = filas.slice(1).filter(f => !f.every(c => c.match(/^[-\s]+$/)) && !f.join("").match(/^[-|\s]+$/));
    return (
      <div style={{overflowX:"auto",marginTop:8}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
          <thead><tr style={{background:"#f1f5f9"}}>{encabezado.map((h,i) => <th key={i} style={{padding:"8px 12px",textAlign:"left",fontWeight:700,color:"#475569",borderBottom:"2px solid #e2e8f0",whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>
          <tbody>{datos.map((fila,i) => { const isTotal = fila[0].toUpperCase().includes("TOTAL"); return <tr key={i} style={{background:isTotal?"#f8fafc":i%2===0?"white":"#f8fafc",borderBottom:"1px solid #e2e8f0"}}>{fila.map((celda,j) => <td key={j} style={{padding:"8px 12px",color:isTotal?"#1e293b":"#334155",fontWeight:isTotal?700:400,verticalAlign:"top"}}>{celda}</td>)}</tr>; })}</tbody>
        </table>
      </div>
    );
  };
  const secciones = [];
  const regex = /(📋|🧭|🏛️|💰|🏢|📅|📊|🎯|⚠️)/g;
  let match; const indices = [];
  while ((match = regex.exec(text)) !== null) indices.push(match.index);
  indices.forEach((idx,i) => {
    const fin = indices[i+1] ?? text.length;
    const bloque = text.slice(idx, fin).trim();
    const primeraLinea = bloque.split("\n")[0].trim();
    const contenido = bloque.slice(primeraLinea.length).trim();
    secciones.push({ titulo: primeraLinea, contenido });
  });
  if (!secciones.length) return <div style={{fontSize:13,lineHeight:1.9,whiteSpace:"pre-wrap",color:"#334155"}}>{text}</div>;
  const seccionConfig = {
    "📋": { bg:"#f0f9ff", border:"#bae6fd", titleColor:"#0369a1" },
    "🧭": { bg:"#fef3c7", border:"#fde68a", titleColor:"#a16207" },
    "🏛️": { bg:"#fdf2f8", border:"#fbcfe8", titleColor:"#9d174d" },
    "💰": { bg:"#ecfdf5", border:"#a7f3d0", titleColor:"#065f46" },
    "🏢": { bg:"#f5f3ff", border:"#ddd6fe", titleColor:"#6d28d9" },
    "📅": { bg:"#f0fdf4", border:"#bbf7d0", titleColor:"#15803d" },
    "📊": { bg:"#f8fafc", border:"#e2e8f0", titleColor:"#1e293b" },
    "🎯": { bg: veredictoColor, border: veredictoB, titleColor: veredictoText },
    "⚠️": { bg:"#fffbeb", border:"#fde68a", titleColor:"#92400e" },
  };
  return (
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      {secciones.map((s,i) => {
        const emoji = ["📋","🧭","🏛️","💰","🏢","📅","📊","🎯","⚠️"].find(e => s.titulo.startsWith(e)) || "📋";
        const cfg = seccionConfig[emoji] || { bg:"#f8fafc", border:"#e2e8f0", titleColor:"#1e293b" };
        const esTabla = s.contenido.includes("|") && s.contenido.split("\n").filter(l => l.includes("|")).length > 2;
        return (
          <div key={i} style={{background:cfg.bg,border:`1px solid ${cfg.border}`,borderRadius:10,padding:"14px 16px"}}>
            <div style={{fontWeight:700,fontSize:13,color:cfg.titleColor,marginBottom:8}}>{s.titulo}</div>
            {esTabla ? parseTabla(s.contenido) : <div style={{fontSize:13,lineHeight:1.7,color:"#334155",whiteSpace:"pre-wrap"}}>{s.contenido}</div>}
          </div>
        );
      })}
    </div>
  );
}

(async () => {
  await sincronizarKeywordsConBackend();
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
})();
</script>
