name: Clasificación IA — Pool Mercado Público

on:
  schedule:
    # 06:00 AM Chile Standard Time (UTC-3) = 09:00 UTC
    - cron: '0 9 * * *'
    # 06:00 PM Chile Standard Time (UTC-3) = 21:00 UTC
    - cron: '0 21 * * *'
  workflow_dispatch:  # Ejecución manual desde GitHub → Actions → "Run workflow"

jobs:
  clasificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Despertar Render (cold start ~60 segundos)
        run: |
          echo "Enviando ping para despertar el servicio..."
          curl -s --max-time 90 https://backend-licitaciones.onrender.com/ > /dev/null || true
          echo "Esperando 30 segundos para asegurar que el servicio esté listo..."
          sleep 30

      - name: Iniciar clasificación IA en background
        run: |
          echo "Iniciando clasificación IA..."
          RESPONSE=$(curl -s -X POST https://backend-licitaciones.onrender.com/mp/clasificar-pool-ia \
            -H "Content-Type: application/json" \
            --max-time 30)
          echo "Respuesta: $RESPONSE"

      - name: Keep-alive durante la clasificación (10 pings × 60 segundos = ~10 minutos)
        run: |
          echo "Manteniendo Render despierto mientras clasifica en background..."
          for i in $(seq 1 10); do
            sleep 60
            STATUS=$(curl -s https://backend-licitaciones.onrender.com/mp/clasificar-pool-ia-status --max-time 10 || echo '{"estado":"sin respuesta"}')
            ESTADO=$(echo $STATUS | grep -o '"estado":"[^"]*"' | cut -d'"' -f4)
            echo "Ping $i/10 — Estado: $ESTADO"
            if [ "$ESTADO" = "completado" ] || [ "$ESTADO" = "error" ]; then
              echo "Clasificación terminada. Estado final: $ESTADO"
              break
            fi
          done

      - name: Estado final
        if: always()
        run: |
          echo "Consultando estado final..."
          curl -s https://backend-licitaciones.onrender.com/mp/clasificar-pool-ia-status | \
            python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print(f'Estado:         {d.get(\"estado\")}')
          print(f'Pool total:     {d.get(\"total_pool\", 0)}')
          print(f'Candidatas:     {d.get(\"total_candidatas\", 0)}')
          print(f'Ya en cache:    {d.get(\"ya_en_cache\", 0)}')
          print(f'Clasificadas:   {d.get(\"total_clasificadas\", 0)}')
          print(f'Errores:        {d.get(\"total_errores\", 0)}')
          print(f'Último error:   {d.get(\"ultimo_error\", \"ninguno\")}')
          print(f'Fin:            {d.get(\"ultimo_fin\", \"en curso\")}')
          " || true
